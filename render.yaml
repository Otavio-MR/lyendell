# Configuração do Render (plano grátis). No painel do Render: New > Blueprint > escolher este repositório.
services:
  - type: web
    name: casa-luckham
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/saude
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ROOT_NOME
        value: Evran Luckham
      # As três abaixo o Render pede na hora de criar (ficam em segredo, fora do código).
      - key: ROOT_SENHA
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Notificações no celular/PC (Web Push): as chaves geradas no .env.
      - key: VAPID_PUBLICA
        sync: false
      - key: VAPID_PRIVADA
        sync: false
      - key: VAPID_CONTATO
        value: https://casa-luckham.onrender.com
      # Anúncios no Discord: o webhook do canal e os IDs dos cargos (veja o README, "Anúncios no Discord").
      - key: DISCORD_WEBHOOK_ANUNCIOS
        sync: false
      - key: DISCORD_CARGO_MORADORES
        sync: false
      - key: DISCORD_CARGO_ALIADOS
        sync: false
